spring.application.name=spring_ai
spring.ai.ollama.base-url=http://localhost:11434
#spring.ai.ollama.chat.options.model=llama3.2
#spring.ai.ollama.chat.options.model=gemma4:latest
spring.ai.ollama.chat.options.model=gemma4:e2b
logging.level.org.springframework.ai.chat.client.advisor=DEBUG


# Enable the H2 web console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Datasource configuration (In-Memory)
#spring.datasource.url=jdbc:h2:mem:testdb
#spring.datasource.url=jdbc:h2:file:F:/projects/java/spring-ai/spring_ai/src/main/resources/memory
spring.datasource.url=jdbc:h2:file:./src/main/resources/memory
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=
spring.datasource.password=
#debug=true


# JPA/Hibernate specific configurations
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.sql.init.schema-locations=classpath:schema.sql

spring.ai.chat.memory.repository.jdbc.initialize-schema=always
spring.ai.chat.memory.repository.jdbc.schema=classpath:schema.sql

spring.ai.ollama.embedding.model=nomic-embed-text


# Qdrant configuration
spring.ai.vectorstore.qdrant.host=localhost
spring.ai.vectorstore.qdrant.port=6334
spring.ai.vectorstore.qdrant.collection-name=vector_store
spring.ai.vectorstore.qdrant.initialize-schema=true