logging.pattern.console=%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %msg%n
logging.level.org.springframework.ai.chat.client.advisor=DEBUG

spring.application.name=mcpserverremote
server.port=8080

spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=gemma4:e2b


# H2 Database
spring.datasource.url=jdbc:h2:file:./src/main/resources/memory
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# MCP Remote Server
spring.ai.mcp.server.protocol=streamable

# Logging
logging.level.root=INFO

spring.ai.mcp.client.stdio.servers-configuration=classpath:mcp-servers.json
spring.ai.mcp.client.request-timeout=300s
spring.ai.mcp.client.streamable-http.connections.mymcp.url=http://localhost:8090
spring.ai.mcp.client.streamable-http.connections.mymcp.endpoint=/mcp
